<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>CodeStudio Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237AA2D6' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root {
  --bg: #0F0F11;
  --surface: #161618;
  --raised: #1D1D20;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text: #E4E4E7;
  --muted: #A0A0A8;
  --faint: #7B7B84;
  --accent: #7AA2D6;
  --high: #E5484D;
  --med: #E0A23B;
  --low: #9A9AA2;
  --ok: #4FB477;
  --r: 8px;
  --r-sm: 6px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 var(--sans); overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(122, 162, 214, 0.3); }
* { scrollbar-width: thin; scrollbar-color: #3a3a40 transparent; }
.muted { color: var(--muted); }

#shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* Header */
#topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 48px; padding: 0 12px; flex: none;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
#topbar .left, #topbar .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { font-weight: 600; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); flex: none; }
.brand .pro { color: var(--muted); font-weight: 500; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--raised); border: 1px solid var(--border-strong); color: var(--text);
  padding: 6px 12px; border-radius: var(--r-sm); font-size: 13px; font-weight: 500;
}
.btn:hover { border-color: rgba(255,255,255,0.28); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0F0F11; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--high); border-color: var(--high); color: #0F0F11; font-weight: 600; }
.btn.ghost { background: transparent; border-color: var(--border); }
.btn kbd {
  font: 11px var(--mono); color: var(--muted); background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
}
.icon-btn {
  display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none;
  background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
  color: var(--muted); font-size: 16px; line-height: 1; padding: 0;
}
.icon-btn:hover { background: var(--raised); color: var(--text); }

.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-sm); overflow: hidden; flex: none; }
.seg button {
  background: transparent; border: 0; color: var(--muted); padding: 4px 10px; font-size: 12px; font-weight: 500;
}
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.seg button:hover { color: var(--text); }
.mobile-tabs, .menu-btn { display: none; }

/* Layout */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.sidebar {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface); border-right: 1px solid var(--border);
}
.side-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 8px 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted);
  border-bottom: 1px solid var(--border); height: 36px;
}
.file-list { list-style: none; margin: 0; padding: 6px 0; flex: 1; overflow-y: auto; }
.file { display: flex; align-items: center; margin: 0 6px 1px; border-radius: var(--r-sm); }
.file:hover { background: var(--raised); }
.file.active { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
.file-open {
  flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 7px 8px 7px 10px;
  font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: var(--r-sm);
}
.file-del { opacity: 0; width: 24px; height: 24px; margin-right: 2px; }
.file:hover .file-del, .file:focus-within .file-del { opacity: 1; }
.file-del:hover { background: var(--high); color: #0F0F11; }
@media (hover: none) { .file-del { opacity: 1; } }

.sec-card {
  text-align: left; margin: 8px; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--r); background: var(--bg); display: grid; gap: 2px;
}
.sec-card:hover { border-color: var(--border-strong); }
.sec-title { font-size: 12px; font-weight: 600; color: var(--muted); }
.sec-status { font-size: 13px; font-weight: 600; }
.sec-status.ok { color: var(--ok); }
.sec-status.warn { color: var(--med); }
.sec-status.bad { color: var(--high); }
.sec-detail { font-size: 12px; color: var(--muted); }

.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.split {
  flex: 1; min-height: 0; display: grid;
  grid-template-columns: var(--split, 50%) 6px minmax(0, 1fr);
}
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.pane-bar {
  display: flex; align-items: center; gap: 10px; height: 36px; flex: none; padding: 0 10px 0 14px;
  background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; overflow-x: auto; white-space: nowrap;
}
.pane-bar .fname { font-weight: 600; color: var(--text); }
.pane-bar .grow { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }

.handle { position: relative; cursor: col-resize; background: transparent; touch-action: none; }
.handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--border-strong); }
.handle:hover::after, .handle:focus-visible::after { left: 1px; width: 3px; background: var(--accent); }
body.dragging { user-select: none; cursor: col-resize; }
body.dragging.dragging-y { cursor: row-resize; }
body.dragging iframe { pointer-events: none; }

/* Editor */
.editor-scroll { flex: 1; min-height: 0; overflow: auto; display: flex; background: var(--bg); }
.gutter {
  position: sticky; left: 0; z-index: 2; flex: none; min-width: 52px; padding: 12px 12px 80px 8px;
  background: var(--bg); border-right: 1px solid var(--border);
  font: 13px/20px var(--mono); color: var(--faint); text-align: right; user-select: none; cursor: text;
}
.gutter .ln { height: 20px; }
.gutter .m-high { color: var(--high); font-weight: 700; }
.gutter .m-med { color: var(--med); font-weight: 700; }
.gutter .m-low { color: var(--low); font-weight: 700; }
.code-box { position: relative; flex: 1 0 auto; min-width: 0; }
.code-box pre, .code-box textarea {
  margin: 0; padding: 12px 16px 80px; border: 0; border-radius: 0;
  font: 13px/20px var(--mono); letter-spacing: 0; word-spacing: 0; tab-size: 2; -moz-tab-size: 2;
  font-variant-ligatures: none; font-kerning: none;
  white-space: pre; overflow-wrap: normal; word-break: normal;
}
.code-box pre { color: var(--text); min-height: 100%; pointer-events: none; }
.code-box textarea {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; overflow: hidden;
  background: transparent; color: transparent; caret-color: var(--text); outline: none;
}
.code-box textarea::selection { background: rgba(122, 162, 214, 0.3); color: transparent; }
.tk-c { color: #70707A; font-style: italic; }
.tk-s { color: #A3C28B; }
.tk-n { color: #D4A574; }
.tk-k { color: #7AA2D6; }
.tk-f { color: #F0F0F2; }
.tk-t { color: #7AA2D6; }
.tk-a { color: #C9B8A0; }
.tk-p { color: #8A8A93; }
.tk-q { color: #9DB4D4; }

/* Preview */
.stage { flex: 1; min-height: 0; padding: 10px; background: #0B0B0D; overflow: auto; }
.frame { margin: 0 auto; width: 100%; max-width: 100%; height: 100%; background: #fff; border-radius: var(--r-sm); overflow: hidden; }
.frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

/* Dock */
.dock { position: relative; flex: none; display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--border); overflow: hidden; }
.grip { position: absolute; top: -3px; left: 0; right: 0; height: 7px; cursor: row-resize; z-index: 3; touch-action: none; }
.dock-tabs { display: flex; align-items: center; gap: 4px; height: 34px; flex: none; padding: 0 8px; border-bottom: 1px solid var(--border); }
.dock-tab {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted);
  padding: 5px 10px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600;
}
.dock-tab:hover { color: var(--text); }
.dock-tab[aria-selected="true"] { color: var(--text); background: var(--raised); }
.count { font-size: 11px; font-weight: 600; min-width: 18px; text-align: center; padding: 0 5px; border-radius: 9px; background: var(--border-strong); color: var(--text); }
.count.bad { background: var(--high); color: #0F0F11; }
.count.warn { background: var(--med); color: #0F0F11; }
.spacer { flex: 1; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px 8px; border-radius: var(--r-sm); }
.link-btn:hover { color: var(--text); background: var(--raised); }
#dockToggle svg { transition: none; }
.dock.collapsed #dockToggle svg { transform: rotate(180deg); }
.dock-body { flex: 1; min-height: 0; overflow: auto; font: 12px/1.5 var(--mono); }
.empty { padding: 16px 14px; color: var(--muted); font: 13px/1.5 var(--sans); max-width: 70ch; }
.con-row { padding: 3px 14px; border-bottom: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; }
.con-row.warn { color: var(--med); }
.con-row.error { color: var(--high); }
.con-row.debug, .con-row.info { color: var(--muted); }

.findings { list-style: none; margin: 0; padding: 0; font-family: var(--sans); }
.finding {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: start; gap: 12px; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--border); padding: 8px 14px; font-size: 13px;
}
.finding:hover { background: var(--raised); }
.sev { display: inline-block; text-align: center; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
.sev.high { color: var(--high); } .sev.med { color: var(--med); } .sev.low { color: var(--low); }
.f-fix { color: var(--muted); font-size: 12px; }
.f-loc { font: 12px var(--mono); color: var(--accent); white-space: nowrap; }
.sec-note { padding: 8px 14px; color: var(--faint); font: 12px var(--sans); }

/* Status bar */
.status {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none;
  height: 24px; padding: 0 12px; background: var(--surface); border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}
.status .grp { display: flex; gap: 16px; }

/* Overlays and dialogs */
.overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(15, 15, 17, 0.97); padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r); }
.captcha-card { position: relative; width: min(360px, 100%); padding: 28px 24px 24px; text-align: center; display: grid; gap: 12px; }
.captcha-card h2 { margin: 0; font-size: 18px; }
.captcha-card.alert { background: #2a1214; border-color: var(--high); box-shadow: 0 0 0 1px var(--high), 0 0 40px rgba(229, 72, 77, 0.35); }
.captcha-card.alert h2 { color: var(--high); }
.captcha-card p { margin: 0; color: var(--muted); }
.captcha-card .lang { position: absolute; top: 10px; right: 10px; }
.cap-q { font: 600 28px var(--mono); padding: 6px 0; }
.captcha-card input {
  width: 120px; justify-self: center; text-align: center; font: 600 18px var(--mono); padding: 8px;
  background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--r-sm);
}
.captcha-card input::-webkit-outer-spin-button, .captcha-card input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.captcha-card input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.err { color: var(--high); font-size: 13px; margin: 0; }

dialog { color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r); padding: 20px; width: min(420px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
dialog h2 { margin: 0 0 8px; font-size: 16px; }
dialog p { margin: 0 0 12px; }
dialog label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
dialog input[type=text] { background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 8px 10px; color: var(--text); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
dialog.pal { width: min(560px, calc(100vw - 32px)); margin: 12vh auto auto; padding: 0; overflow: hidden; }
.pal input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--border); padding: 14px 16px; font-size: 15px; color: var(--text); outline: none; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.pal li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; }
.pal li[aria-selected="true"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
.pal li span:last-child { color: var(--faint); font: 11px var(--mono); }
.pal .none { padding: 12px 10px; color: var(--muted); cursor: default; }

#toasts { position: fixed; right: 12px; bottom: 36px; z-index: 200; display: grid; gap: 8px; justify-items: end; }
.toast { background: var(--raised); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; max-width: min(360px, 90vw); }
.toast.warn { border-color: var(--med); }

/* Legal dialog */
dialog.legal { width: min(660px, calc(100vw - 32px)); padding: 0; }
#legalInner { padding: 20px; display: grid; gap: 12px; }
#legalInner h2 { margin: 0; }
.legal-body { max-height: min(60vh, 520px); overflow: auto; padding-right: 8px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.legal-body h3 { margin: 16px 0 4px; font-size: 13px; color: var(--text); }
.legal-body h3:first-child { margin-top: 0; }
.legal-body p { margin: 0 0 8px; }
.legal-body a { color: var(--accent); }
.legal-body a.discord-btn, .discord-btn {
  display: inline-flex; align-items: center; gap: 10px; margin: 2px 0 6px; padding: 9px 16px;
  background: #5865F2; border: 1px solid #5865F2; border-radius: var(--r-sm);
  color: #fff; font: 600 14px var(--sans); text-decoration: none; cursor: pointer;
}
.discord-btn:hover { background: #4752C4; border-color: #4752C4; }
.discord-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.discord-btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
.legal-meta { color: var(--faint); font-size: 12px; margin-bottom: 12px; }
.cap-legal { display: flex; justify-content: center; gap: 4px; }
.status .grp { white-space: nowrap; align-items: center; }
.status .link-btn { padding: 0 6px; font-size: 12px; line-height: 20px; }

/* Small screens */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 50; top: 48px; bottom: 24px; left: 0; width: 248px; display: none; }
  .sidebar.open { display: flex; }
  .menu-btn, .mobile-tabs { display: inline-flex; }
  #importBtn, #paletteBtn kbd, .brand .pro { display: none; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .handle { display: none; }
  .work[data-view="editor"] .preview-pane { display: none; }
  .work[data-view="preview"] .editor-pane { display: none; }
  #deviceSeg, #frameW { display: none; }
}
@media (max-width: 520px) {
  .brand strong { display: none; }
  #stLang, #stSize, #stSave, [data-i18n="st.by"] { display: none; }
  .status { justify-content: space-between; }
  #paletteBtn { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<noscript><p style="padding:24px">CodeStudio Pro needs JavaScript.</p></noscript>

<div id="captcha" class="overlay" role="dialog" aria-modal="true" aria-labelledby="cap-title" hidden>
  <div class="card captcha-card">
    <div class="seg lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button>
    </div>
    <h2 id="cap-title" data-i18n="cap.title"></h2>
    <p data-i18n="cap.prompt"></p>
    <div id="cap-q" class="cap-q"></div>
    <input id="cap-in" type="number" inputmode="numeric" autocomplete="off" aria-labelledby="cap-q">
    <button type="button" class="btn primary" id="cap-ok" style="justify-content:center" data-i18n="cap.ok"></button>
    <p id="cap-err" class="err" role="alert" hidden data-i18n="cap.wrong"></p>
    <div class="cap-legal">
      <button type="button" class="link-btn" data-legal="tos" data-i18n="legal.tos"></button>
      <button type="button" class="link-btn" data-legal="imprint" data-i18n="legal.imprint"></button>
    </div>
  </div>
</div>

<div id="shell" inert>
  <header id="topbar">
    <div class="left">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" data-i18n-label="nav.explorer">&#9776;</button>
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
        <strong>CodeStudio <span class="pro">Pro</span></strong>
      </div>
    </div>
    <div class="mobile-tabs seg" id="viewSeg" role="group">
      <button type="button" data-view="editor" aria-pressed="true" data-i18n="nav.code"></button>
      <button type="button" data-view="preview" aria-pressed="false" data-i18n="nav.preview"></button>
    </div>
    <div class="right">
      <button type="button" class="btn ghost" id="importBtn" data-i18n="nav.import"></button>
      <button type="button" class="btn" id="exportBtn" data-i18n="nav.export"></button>
      <button type="button" class="btn ghost" id="paletteBtn"><span data-i18n="nav.commands"></span><kbd>Ctrl K</kbd></button>
      <div class="seg lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button>
      </div>
    </div>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span data-i18n="nav.explorer"></span>
        <button type="button" class="icon-btn" id="newFileBtn" data-i18n-label="nav.newFile">+</button>
      </div>
      <ul class="file-list" id="fileList"></ul>
      <button type="button" class="sec-card" id="secCard">
        <span class="sec-title" data-i18n="sec.title"></span>
        <span class="sec-status ok" id="secStatus"></span>
        <span class="sec-detail" id="secDetail"></span>
      </button>
    </aside>

    <section class="work" id="work" data-view="editor">
      <div class="split" id="split">
        <div class="pane editor-pane">
          <div class="pane-bar"><span class="fname" id="curName"></span></div>
          <div class="editor-scroll" id="edScroll">
            <div class="gutter" id="gutter" aria-hidden="true"></div>
            <div class="code-box">
              <pre id="hl" aria-hidden="true"></pre>
              <textarea id="codeEditor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off" aria-label="Code editor"></textarea>
            </div>
          </div>
        </div>
        <div class="handle" id="handle" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-label="nav.resize"></div>

  commit();

  for (const [name, content] of files) {
    const e = extOf(name);
    let out = content;
    if (!content.includes(SITE_URL)) {
      if (e === 'js' || e === 'mjs' || e === 'css') out += `\n\n/* ${mark} */`;

function uniqueName(name) {

  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  for (let i = 2; i < 1000; i++) { const n = `${base}-${i}${ext}`; if (!files.has(n) && NAME_RE.test(n)) return n; }
  return null;
}
async function importFiles(list) {
  let added = 0, skipped = 0;
  const addOne = (rawName, text) => {
    const name = rawName.split(/[\\/]/).pop();
    if (!NAME_RE.test(name) || !TEXT_EXT.includes(extOf(name)) || text.length > MAX_BYTES || files.size >= MAX_FILES) { skipped++; return; }
    const final = uniqueName(name);
    if (!final) { skipped++; return; }
    files.set(final, text); added++;
  };
  for (const f of list) {
    if (f.size > 5000000) { skipped++; continue; }
    if (extOf(f.name) === 'zip') {
      if (typeof JSZip === 'undefined') { toast(t('toast.zipMissing'), 'warn'); continue; }
      try {
        const zip = await JSZip.loadAsync(f);
        const entries = zip.file(/.*/).slice(0, 200);

          if (entry.name.includes('__MACOSX') || entry.name.split('/').pop().startsWith('.')) { skipped++; continue; }

function ask({ title, message = '', label = '', value = '', validate = null, okText = '', danger = false }) {

    $('#dlgLabelWrap').hidden = !label; $('#dlgLabel').textContent = label;

    fails = 0; ssSet(FAIL_KEY, '0');
    ssSet(HUMAN_KEY, '1');
    const done = () => { el.captcha.hidden = true; el.shell.inert = false; intro(); };
    if (motionOK()) gsap.to(el.captcha, { autoAlpha: 0, duration: 0.25, onComplete: done }); else done();
    return;
  }
  fails++;
  ssSet(FAIL_KEY, String(fails));
  if (fails >= MAX_FAILS) { kickOut(); return; }
  markCaptcha();
  $('#cap-err').hidden = false;
  initCaptcha();
  $('#cap-in').focus();
  if (motionOK()) {
    gsap.to('.captcha-card', { keyframes: [{ x: -8, duration: 0.06 }, { x: 8, duration: 0.06 }, { x: -5, duration: 0.06 }, { x: 5, duration: 0.06 }, { x: 0, duration: 0.06 }] });
  }
}
$('#cap-ok').addEventListener('click', verifyCaptcha);
$('#cap-in').addEventListener('keydown', e => { if (e.key === 'Enter') verifyCaptcha(); });

/* ---------- Intro (one orchestrated sequence) ---------- */
function intro() {
  if (!motionOK()) return;
  gsap.timeline({ defaults: { ease: 'power2.out', duration: 0.42, clearProps: 'transform,opacity,visibility' } })
    .from('#topbar', { y: -14, autoAlpha: 0 })
    .from('#sidebar', { x: -14, autoAlpha: 0 }, '<0.08')
    .from('.editor-pane, .preview-pane', { y: 10, autoAlpha: 0, stagger: 0.08 }, '<0.08')
    .from('#dock, .status', { autoAlpha: 0 }, '<0.1');
}

/* ---------- Boot ---------- */
function boot() {
  if (ssGet(LOCK_KEY) === '1') { kickOut(); return; }
  const saved = lsGet(LANG_KEY);
  lang = saved === 'de' || saved === 'en' ? saved : (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en';
  applyI18n();
  try { localStorage.removeItem(STORE_KEY); } catch { /* ignore */ }
  files = starter(); current = 'index.html'; setSplit(50);
  if (window.matchMedia('(max-width: 860px)').matches) dockH = 170;
  el.dock.style.height = dockH + 'px';
  el.ed.value = files.get(current);
  renderHL(); renderGutter(true); renderFileList(); updateBar(); updateStatus();
  conEmpty();
  showDock('console');
  findings = scanAll(); renderSecurity(); renderGutter(true);
  runPreview();
  setSave('saved');

  if (ssGet(HUMAN_KEY) === '1') { el.captcha.hidden = true; el.shell.inert = false; intro(); }
  else { el.captcha.hidden = false; initCaptcha(); if (fails > 0) { markCaptcha(); $('#cap-err').hidden = false; } $('#cap-in').focus(); }
}
boot();
})();
</script>
